<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problem 5</title>
<style>
    body {
        font-size: 30px;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        border: 2px double black;
    }
    th, td {
        padding: 8px;
        text-align: center;
        height: 300px;
    }
    button {
        font-size: inherit; 
        width: 100%;

        height: 100%;

    }
    .nested-table {
        width: 100%;
        height: 100%;
    }
    .nested-table td {

    }
    .nested-table button {

    }
</style>

        <td colspan="1"><button>2048</button></td>
    </tr>
    <tr>

                    <td><button>Social Life</button></td>
